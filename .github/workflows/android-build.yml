name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["platform/android/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["platform/android/**", ".github/workflows/android-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for Android project
        id: project
        run: |
          if [[ -f platform/android/gradlew ]]; then
            test -f platform/android/gradle/wrapper/gradle-wrapper.jar
            test -f platform/android/gradle/wrapper/gradle-wrapper.properties
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ -f platform/android/settings.gradle || -f platform/android/settings.gradle.kts ]]; then
            echo "::error::Android project exists but its committed Gradle wrapper is missing."
            exit 1
          else
            echo "::notice::No Android project yet; Android build skipped."
            echo "Android build skipped: add the project and complete Gradle wrapper." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Java
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ vars.ANDROID_JAVA_VERSION || '17' }}
          cache-jdk: false

      - name: Install Android SDK Platform 37
        if: steps.project.outputs.ready == 'true'
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"'

      - name: Lint, run unit tests, and build debug APKs
        if: steps.project.outputs.ready == 'true'
        working-directory: platform/android
        run: bash gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APKs
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.event.repository.name }}-android-debug
          path: platform/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
