name: iOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["platform/ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["platform/ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build for iOS Simulator
        working-directory: platform/ios
        run: |
          xcodebuild -version
          xcodebuild -project "plain RSS.xcodeproj" -scheme "plain RSS" \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/derived-data CODE_SIGNING_ALLOWED=NO build

      - name: Package Simulator applications
        working-directory: platform/ios
        run: |
          shopt -s nullglob
          apps=(build/derived-data/Build/Products/Debug-iphonesimulator/*.app)
          if (( ${#apps[@]} == 0 )); then
            echo "::error::No Simulator application was produced."
            exit 1
          fi
          # Archive first so app permissions and symlinks survive artifact upload.
          tar -czf build/ios-simulator.tar.gz "${apps[@]}"

      - name: Upload Simulator build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.event.repository.name }}-ios-simulator-${{ runner.arch }}
          path: platform/ios/build/ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 30
